<title>Storia di Helios</title>
<meta name="description" content="La storia del progetto Helios raccontata dai suoi commit, con il grafo dei rami nello stile di Le Git Graph." />
<!-- Grafo disegnato con d3 (SVG); i commit si leggono dalle API pubbliche di GitHub a ogni apertura -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* Colori di GitHub (scuro e chiaro), come Le Git Graph sulla pagina "Commits" */
  :root {
    --bg: #0d1117; --bg-row: #0d1117; --bg-hover: #161b22; --bg-btn: #21262d; --bg-btn-hover: #30363d;
    --border: #30363d; --border-muted: #21262d; --text: #e6edf3; --muted: #7d8590; --link: #4493f8;
    --green: #3fb950; --red: #f85149; --header: #010409; --tip: #161b22; --shadow: rgba(1, 4, 9, 0.85);
    --story: #161b22; --accent: #f78166;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff; --bg-row: #ffffff; --bg-hover: #f6f8fa; --bg-btn: #f6f8fa; --bg-btn-hover: #eaeef2;
      --border: #d0d7de; --border-muted: #d8dee4; --text: #1f2328; --muted: #656d76; --link: #0969da;
      --green: #1a7f37; --red: #d1242f; --header: #f6f8fa; --tip: #ffffff; --shadow: rgba(140, 149, 159, 0.3);
      --story: #f6f8fa; --accent: #fd8c73;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-row: #ffffff; --bg-hover: #f6f8fa; --bg-btn: #f6f8fa; --bg-btn-hover: #eaeef2;
    --border: #d0d7de; --border-muted: #d8dee4; --text: #1f2328; --muted: #656d76; --link: #0969da;
    --green: #1a7f37; --red: #d1242f; --header: #f6f8fa; --tip: #ffffff; --shadow: rgba(140, 149, 159, 0.3);
    --story: #f6f8fa; --accent: #fd8c73;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  svg.oct { width: 16px; height: 16px; fill: currentColor; vertical-align: text-bottom; flex: none; }

  /* Testata come GitHub */
  .gh-header { background: var(--header); border-bottom: 1px solid var(--border); padding: 16px 32px 0; }
  .repo { display: flex; align-items: center; gap: 8px; font-size: 20px; flex-wrap: wrap; }
  .repo .owner { color: var(--link); }
  .repo .name { color: var(--link); font-weight: 600; }
  .repo .vis { font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 2em; padding: 0 7px; line-height: 18px; }
  .theme-btn { margin-left: auto; }
  .tabs { display: flex; gap: 8px; margin-top: 16px; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 8px 8px 12px; color: var(--text); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; background: none; border-top: 0; border-left: 0; border-right: 0; font: inherit; }
  .tab:hover { text-decoration: none; }
  .tab .count { background: rgba(110, 118, 129, 0.4); border-radius: 2em; padding: 0 6px; font-size: 12px; font-weight: 500; line-height: 18px; }
  .tab.on { border-bottom-color: var(--accent); font-weight: 600; }
  .tab:not(.on) { color: var(--muted); }

  main { max-width: 1280px; margin: 0 auto; padding: 24px 32px 64px; }

  /* Racconto: introduzione e numeri */
  .intro { border: 1px solid var(--border); border-radius: 6px; padding: 20px 24px; margin-bottom: 24px; background: var(--story); }
  .intro h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
  .intro p { margin: 0 0 12px; color: var(--muted); max-width: 900px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 8px; }
  .stat b { font-size: 18px; margin-right: 4px; }
  .stat { color: var(--muted); }
  .people { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
  .person { display: flex; align-items: center; gap: 8px; }
  .person img, .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-btn); flex: none; }
  .person img { width: 32px; height: 32px; }
  .person small { display: block; color: var(--muted); }

  /* Filtri dei rami (pillole come Le Git Graph) */
  .branches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-btn); color: var(--text); font: 500 14px/20px inherit; cursor: pointer; font-family: inherit; }
  .pill:hover { background: var(--bg-btn-hover); }
  .pill.on { border-color: var(--link); box-shadow: inset 0 0 0 1px var(--link); }
  .pill .ring { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--c); }

  /* Elenco dei commit con il grafo a sinistra */
  .list { position: relative; border: 1px solid var(--border); border-radius: 6px; }
  .graph { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .graph .node { pointer-events: all; cursor: pointer; }
  .day { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 14px 16px 8px var(--gutter); border-top: 1px solid var(--border-muted); }
  .day:first-child { border-top: 0; }
  .story { margin: 4px 16px 10px var(--gutter); padding: 12px 16px; border: 1px solid var(--border); border-left: 3px solid var(--link); border-radius: 6px; background: var(--story); }
  .story h3 { margin: 0 0 4px; font-size: 15px; }
  .story p { margin: 0; color: var(--muted); white-space: pre-line; }
  .story p + p { margin-top: 6px; }
  .story .from { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px 8px var(--gutter); border-top: 1px solid var(--border-muted); }
  .row:hover { background: var(--bg-hover); }
  .row.hit { background: rgba(56, 139, 253, 0.15); }
  .row .main { flex: 1; min-width: 0; }
  .title { font-weight: 600; color: var(--text); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title a { color: inherit; }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 2px; flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }
  .meta .ok { color: var(--green); }
  .label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 0 7px; border-radius: 2em; border: 1px solid var(--c, var(--border)); color: var(--c, var(--muted)); line-height: 18px; }
  .actions { display: flex; gap: 0; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid var(--border); background: var(--bg-btn); color: var(--muted); font: 12px inherit; cursor: pointer; }
  .btn:hover { background: var(--bg-btn-hover); color: var(--text); text-decoration: none; }
  .btn.hash { color: var(--link); border-left: 0; border-radius: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .btn.copy { border-radius: 6px 0 0 6px; }
  .btn.browse { border-radius: 6px; margin-left: 8px; }

  /* Scheda al passaggio sul pallino */
  .tip { position: absolute; z-index: 10; width: 340px; background: var(--tip); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px var(--shadow); font-size: 13px; display: none; }
  .tip > div { padding: 8px 12px; border-top: 1px solid var(--border-muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .tip > div:first-child { border-top: 0; }
  .tip .ref { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-btn); }
  .tip .add { color: var(--green); } .tip .del { color: var(--red); }

  @media (max-width: 720px) {
    .gh-header { padding: 12px 16px 0; }
    main { padding: 16px 16px 48px; }
    .actions .copy, .actions .browse { display: none; }
    .btn.hash { border-left: 1px solid var(--border); border-radius: 6px; }
    .tip { width: min(340px, calc(100vw - 32px)); }
  }
</style>
</head>

const STORY = {
  "2026-10-14": ["Nasce Helios", "Il primo giorno arriva il cuore del progetto: un client web di Yu-Gi-Oh! che gira tutto nel browser, con il motore EDOPro (ocgcore in WebAssembly) e i duelli peer-to-peer via WebRTC. Si sistemano subito i codici invito, le stanze online passano da un Worker di Cloudflare, arrivano i mazzi mescolati, le pescate in ordine contro la CPU e gli sleeve personalizzati; il protocollo online sale alla versione 2. Prima pull request su main."],
  "2026-10-15": ["Il giorno della lucidatura", "Il giorno più fitto: decine di piccoli rilasci da testing a main. Il deck editor diventa una griglia di carte (anche a lista) con i preferiti da trascinare, il duello ha lo stesso aspetto su ogni schermo, arriva il campo \"Crypt\", le finestre di scelta si possono ridurre, la catena ha i tasti Auto / On / Off, le summon si annullano fino alla scelta della zona e i materiali si scelgono sul campo. E poi partite al meglio di 3 e 5, la recipe di YGO Omega, i preferiti predefiniti e l'azzurro al posto del verde lime."],
  "2026-10-16": ["Arriva il Combo Trainer", "Nasce il Combo Trainer: si registrano, si condividono e si rivedono le combo, anche in video. Entra nel progetto Elio con i primi file per organizzare idee, bug e promemoria."],
  "2026-10-17": ["Campi 3D e stanze senza server", "I campi 3D in three.js si caricano da un link o da uno .zip (anche Dropbox, Google Drive e ArDrive); le stanze online diventano decentralizzate con Trystero sui relay Nostr pubblici; il Combo Trainer diventa preciso, con le scelte puntuali, la strict mode e lo stato di partenza della partita. Elio aggiunge altre idee."],
  "2026-10-18": ["Versione 1.0 beta", "Helios si installa come app (PWA), nasce la sezione Training con l'HDPC (le probabilità di aprire le proprie carte), il side deck e le partite al meglio di N. Il Trainer si stacca dai mazzi, con varianti, scheda della combo e spreadsheet; il sito si ripubblica da solo quando cambiano le banlist. Esce la 1.0 beta, arrivano il supporto Genesys e il trailer girato sull'app vera."],
  "2026-10-19": ["Le liste di Elio", "Elio aggiorna le liste di feature, bug e promemoria che guideranno il lavoro dei giorni dopo."],
  "2026-10-20": ["Un solo file", "Helios diventa anche un unico file HTML, pubblicato da solo nelle release, con i relay Nostr come stanze predefinite. L'HDPC accetta carte in più gruppi, il Trainer salva e importa i board state, ci sono i preset di gioco e i Base decks in arrivo. Su segnalazione dei video l'auto-play del Trainer torna a mostrare le animazioni; le schede del deck builder non si tagliano più; le banlist si aggiornano da sole e le carte proibite escono dai preferiti. Dalla 1.0.2 alla 1.0.7 in un giorno."],

// Giorno nel fuso orario locale (GitHub dà le date in UTC: un commit delle 00:30 italiane è del giorno dopo).
const day = (iso) => new Date(iso).toLocaleDateString("sv-SE");
const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
const fmtFull = (iso) => new Date(iso).toLocaleString("it-IT", { dateStyle: "long", timeStyle: "medium" });
function ago(iso) {
  const s = (TODAY - new Date(iso)) / 1000;
  if (s < 60) return "adesso";
  if (s < 3600) return `${Math.round(s / 60)} minuti fa`;
  if (s < 86400) { const h = Math.round(s / 3600); return h === 1 ? "un'ora fa" : `${h} ore fa`; }
  const d = Math.round(s / 86400);
  return d === 1 ? "ieri" : d < 30 ? `${d} giorni fa` : `il ${new Date(iso).toLocaleDateString("it-IT")}`;
}
const short = (h) => h.slice(0, 7);

// ---------------------------------------------------------------- dati da GitHub
// Commit di tutti i rami (con i genitori), punte dei rami e tag delle release. Le righe aggiunte/tolte
// arrivano solo passando su un commit (una richiesta per commit: senza login GitHub ne concede 60 all'ora).
// Tutto resta in cache nel browser per 10 minuti; ↻ rilegge subito.
const CACHE = "helios-history-data-2";
const STATS = "helios-history-stats";
const TTL = 10 * 60 * 1000;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
async function gh(path) {
  const r = await fetch(API + path, { headers: { Accept: "application/vnd.github+json" } });
  if (!r.ok) {
    const reset = +r.headers.get("x-ratelimit-reset");
    if ((r.status === 403 || r.status === 429) && r.headers.get("x-ratelimit-remaining") === "0")
      throw new Error(`GitHub ha raggiunto il limite di richieste senza login: riprova dopo le ${new Date(reset * 1000).toLocaleTimeString("it-IT")}.`);
    throw new Error(`GitHub ha risposto ${r.status} per ${path}`);
  }
  return r.json();
}
async function pages(path) {
  const out = [];
  for (let p = 1; p <= 20; p++) {
    const part = await gh(`${path}${path.includes("?") ? "&" : "?"}per_page=100&page=${p}`);
    out.push(...part);
    if (part.length < 100) break;
  }
  return out;
}
// Descrizioni scritte nei commenti delle pull request, tra BEGINNING HELIOSTORY DESCRIPTION
// ed ENDING HELIOSTORY DESCRIPTION (o B.H.D / B.E.D ed E.H.D). Valgono solo i commenti di chi
// lavora al progetto: su un repository pubblico chiunque può commentare.
const NOTE = /(?:BEGINNING\s+HELIOSTORY\s+DESCRIPTION|B\.[HE]\.D\.?)([\s\S]*?)(?:ENDING\s+HELIOSTORY\s+DESCRIPTION|E\.H\.D\.?)/gi;
const TRUSTED = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
const TEAM = new Set(Object.values(PEOPLE).map((p) => p.login).filter(Boolean));
function notes(comments) {
  const out = {};
  for (const k of comments) {
    const pr = k.html_url?.match(/\/pull\/(\d+)#/);
    if (!pr || !(TRUSTED.has(k.author_association) || TEAM.has(k.user?.login))) continue;
    for (const m of (k.body ?? "").matchAll(NOTE)) {
      const text = m[1].trim();
      if (text) (out[pr[1]] ??= []).push({ text, login: k.user.login, url: k.html_url });
    }
  }
  return out;
}
/** Ordine del grafo: dal più recente, ma un commit sempre prima dei suoi genitori. */
function order(list) {
  const map = new Map(list.map((c) => [c.hash, c]));
  const children = new Map(list.map((c) => [c.hash, 0]));
  for (const c of list) for (const p of c.parents) if (children.has(p)) children.set(p, children.get(p) + 1);
  const ready = list.filter((c) => !children.get(c.hash));
  const out = [];
  while (ready.length) {
    ready.sort((a, b) => b.date.localeCompare(a.date));
    const c = ready.shift();
    out.push(c);
    for (const p of c.parents) {
      if (!map.has(p)) continue;
      children.set(p, children.get(p) - 1);
      if (!children.get(p)) ready.push(map.get(p));
    }
  }
  return out;
}
async function load(force = false) {
  const cached = store.get(CACHE);
  if (!force && cached && Date.now() - cached.t < TTL) return cached;
  const [branches, tags, comments] = await Promise.all([gh("/branches?per_page=100"), pages("/tags"), pages("/issues/comments")]);
  const lists = await Promise.all(branches.map((b) => pages(`/commits?sha=${encodeURIComponent(b.name)}`)));
  const bySha = new Map();
  for (const c of lists.flat()) {
    if (bySha.has(c.sha)) continue;
    const [subject, ...rest] = c.commit.message.split("\n");
    bySha.set(c.sha, {
      hash: c.sha,
      parents: c.parents.map((p) => p.sha),
      author: c.commit.author.name,
      login: c.author?.login ?? null,
      avatar: c.author?.avatar_url ? `${c.author.avatar_url}&s=64` : null,
      date: c.commit.committer.date,
      subject,
      body: rest.join("\n").trim(),
      refs: [],
      tags: [],
    });
  }
  for (const b of branches) bySha.get(b.commit.sha)?.refs.push(b.name);
  for (const t of tags) bySha.get(t.commit.sha)?.tags.push(t.name);
  const data = { t: Date.now(), commits: order([...bySha.values()]), branches: branches.map((b) => ({ name: b.name, head: b.commit.sha })), notes: notes(comments) };
  store.set(CACHE, data);
  return data;
}
/** Righe aggiunte/tolte di un commit (da GitHub, una volta sola). */
async function stats(c) {
  const all = store.get(STATS) ?? {};
  if (all[c.hash]) return all[c.hash];
  const d = await gh(`/commits/${c.hash}`);
  const s = { add: d.stats?.additions ?? 0, del: d.stats?.deletions ?? 0, files: d.files?.length ?? 0 };
  store.set(STATS, { ...(store.get(STATS) ?? {}), [c.hash]: s });
  return s;
}

// ---------------------------------------------------------------- rami e filtri
let byHash = new Map();
function reach(from) {
  const seen = new Set();
  const stack = from ? [from] : [];
  while (stack.length) {
    const h = stack.pop();
    if (seen.has(h) || !byHash.has(h)) continue;
    seen.add(h);
    stack.push(...byHash.get(h).parents);
  }
  return seen;
}
// Rami del repository su GitHub (main per primo), ognuno con i commit che contiene.
const BRANCH_COLORS = { main: "#f85149", testing: "#d2a8ff" };
let BRANCHES = [];
let NOTES = {};
function prepare(data) {
  ALL = data.commits;
  NOTES = data.notes ?? {};
  byHash = new Map(ALL.map((c) => [c.hash, c]));
  const extra = ["#e3b341", "#58a6ff", "#3fb950", "#ffa657"];
  BRANCHES = data.branches
    .sort((a, b) => (a.name === "main" ? -1 : b.name === "main" ? 1 : a.name.localeCompare(b.name)))
    .map((b, i) => ({ key: b.name, label: b.name, head: b.head, color: BRANCH_COLORS[b.name] ?? extra[i % extra.length] }));
  for (const b of BRANCHES) b.set = reach(b.head);
}
const inBranches = (hash) => BRANCHES.filter((b) => b.set.has(hash)).map((b) => b.label);

// ---------------------------------------------------------------- corsie del grafo (come Le Git Graph)
const PALETTE = ["#f85149", "#58a6ff", "#d2a8ff", "#e3b341", "#3fb950", "#ff7b72", "#79c0ff", "#ffa657", "#56d364", "#db61a2"];
/**
 * Corsie: si scorrono i commit dal più nuovo; ogni corsia "aspetta" un commit (il primo genitore di quello
 * sopra). Un commit prende la corsia che lo aspetta (o una libera); i genitori in più (merge) aprono una
 * corsia nuova o si uniscono a quella che già li aspetta. Ogni corsia ha il suo colore.
 */
function layout(commits) {
  const set = new Set(commits.map((c) => c.hash));
  const lanes = []; // hash atteso o null
  const laneColor = [];
  let colorIx = 0;
  const pos = new Map(); // hash -> { lane, row, color }
  const edges = []; // { from, to, lane, color }
  const take = (hash) => {
    let i = lanes.indexOf(null);
    if (i < 0) i = lanes.length;
    lanes[i] = hash;
    laneColor[i] = PALETTE[colorIx++ % PALETTE.length];
    return i;
  };
  commits.forEach((c, row) => {
    let lane = lanes.indexOf(c.hash);
    if (lane < 0) lane = take(c.hash);
    // altre corsie che aspettavano questo commit: finiscono qui
    lanes.forEach((h, i) => { if (h === c.hash && i !== lane) lanes[i] = null; });
    const color = laneColor[lane];
    pos.set(c.hash, { lane, row, color });
    const parents = c.parents.filter((p) => set.has(p));
    if (!parents.length) { lanes[lane] = null; return; }
    // Primo genitore già atteso da un'altra corsia: si confluisce lì (niente linee parallele per lo stesso ramo).
    const waiting = lanes.indexOf(parents[0]);
    if (waiting >= 0 && waiting !== lane) {
      lanes[lane] = null;
      edges.push({ from: c.hash, to: parents[0], lane: waiting, color: laneColor[waiting] });
    } else {
      lanes[lane] = parents[0];
      edges.push({ from: c.hash, to: parents[0], lane, color });
    }
    for (const p of parents.slice(1)) {
      let l = lanes.indexOf(p);
      if (l < 0) l = take(p);
      edges.push({ from: c.hash, to: p, lane: l, color: laneColor[l] });
    }
  });
  const width = Math.max(1, ...[...pos.values()].map((p) => p.lane + 1), ...edges.map((e) => e.lane + 1));
  return { pos, edges, width };
}

// ---------------------------------------------------------------- pagina
let filter = "all";
const list = document.getElementById("list");
const tip = document.getElementById("tip");
const LANE = 14;
const PAD = 16;
let current = null;

function renderIntro() {
  const days = new Set(ALL.map((c) => day(c.date)));
  const prs = ALL.filter((c) => /^Merge pull request #\d+/.test(c.subject)).length;
  const tags = ALL.flatMap((c) => c.tags);
  const first = ALL.at(-1), last = ALL[0];
  document.getElementById("count").textContent = ALL.length;
  document.getElementById("prs").textContent = prs;
  document.getElementById("rels").textContent = tags.length;
  const counts = {};
  for (const c of ALL) { const w = person(c.author).who; counts[w] = (counts[w] ?? 0) + 1; }
  const intro = document.getElementById("intro");
  intro.replaceChildren(
    el("h1", {}, "La storia di Helios"),
    el("p", {}, `Un client web di Yu-Gi-Oh! con il motore EDOPro e i duelli peer-to-peer, nato il ${fmtDay(day(first.date))}. In ${days.size} giorni è diventato un deck builder, un Combo Trainer, un calcolatore di probabilità e un'app che sta in un solo file. Qui sotto, giorno per giorno, il racconto e tutti i commit con il grafo dei rami: passa sui pallini per i dettagli.`),
    el("div", { class: "stats" },
      el("span", { class: "stat" }, el("b", {}, ALL.length), "commit"),
      el("span", { class: "stat" }, el("b", {}, prs), "pull request"),
      el("span", { class: "stat" }, el("b", {}, tags.length), "release"),
      el("span", { class: "stat" }, el("b", {}, days.size), "giorni"),
      el("span", { class: "stat" }, el("b", {}, BRANCHES.length), BRANCHES.length === 1 ? "ramo" : "rami"),
      el("span", { class: "stat" }, "ultimo commit ", el("b", {}, ago(last.date))),
      el("span", { class: "stat" }, "dati da GitHub ", el("b", {}, ago(new Date(loadedAt).toISOString())))
    ),
    el("div", { class: "people" }, Object.entries(counts).map(([who, n]) => {
      const name = Object.keys(PEOPLE).find((k) => PEOPLE[k].who === who) ?? who;
      const login = person(name).login ?? ALL.find((c) => person(c.author).who === who)?.login;
      return el("div", { class: "person" }, avatar(name, "", login ? `https://github.com/${login}.png?size=64` : null), el("div", {}, el("b", {}, who), el("small", {}, `${n} commit${login ? ` · @${login}` : ""}`)));
    }))
  );
}

function renderBranches() {
  const box = document.getElementById("branches");
  box.replaceChildren(
    el("button", { class: `pill${filter === "all" ? " on" : ""}`, onclick: () => setFilter("all") }, oct("branch"), "All branches"),
    ...BRANCHES.map((b) => el("button", { class: `pill${filter === b.key ? " on" : ""}`, style: `--c: ${b.color}`, onclick: () => setFilter(b.key) }, el("span", { class: "ring" }), b.label))
  );
}

function setFilter(f) {
  filter = f;
  renderBranches();
  renderList();
}

function renderList() {
  const b = BRANCHES.find((x) => x.key === filter);
  const commits = b ? ALL.filter((c) => b.set.has(c.hash)) : ALL;
  current = layout(commits);
  const gutter = PAD * 2 + current.width * LANE;
  list.style.setProperty("--gutter", `${gutter}px`);
  list.replaceChildren();
  let lastDay = null;
  const told = new Set();
  for (const c of commits) {
    const d = day(c.date);
    if (d !== lastDay) {
      lastDay = d;
      list.append(el("div", { class: "day" }, oct("commit"), `Commit del ${fmtDay(d)}`));
      const st = STORY[d];
      if (st && !told.has(d)) list.append(el("div", { class: "story" }, el("h3", {}, st[0]), el("p", {}, st[1])));
      told.add(d);
    }
    const note = noteFor(c);
    if (note) list.append(note);
    list.append(row(c));
  }
  drawGraph(commits);
}

/** Scheda della pull request sopra il suo commit di merge, se nei commenti c'è una descrizione. */
function noteFor(c) {
  const pr = c.subject.match(/^Merge pull request #(\d+)/)?.[1];
  const all = pr && NOTES[pr];
  if (!all) return null;
  // Il titolo: la prima riga se inizia con "#", altrimenti il titolo della PR (nel corpo del merge).
  let [first, ...rest] = all.map((n) => n.text).join("\n\n").split("\n");
  let title = c.body.split("\n")[0] || `Pull request #${pr}`;
  if (/^#+\s/.test(first)) title = first.replace(/^#+\s*/, "");
  else rest.unshift(first);
  const paras = rest.join("\n").trim().split(/\n\s*\n/).filter(Boolean);
  return el("div", { class: "story" },
    el("h3", {}, title),
    ...paras.map((t) => el("p", {}, t)),
    el("div", { class: "from" }, el("a", { href: all.at(-1).url, style: "color: var(--link)" }, `#${pr}`), ` · ${[...new Set(all.map((n) => n.login))].join(", ")}`)
  );
}

function row(c) {
  const p = person(c.author);
  const pr = c.subject.match(/^Merge pull request #(\d+)/);
  const labels = [
    ...c.refs.map((r) => el("span", { class: "label", style: `--c: ${BRANCHES.find((b) => r.endsWith(b.label))?.color ?? "var(--muted)"}` }, oct("branch"), r)),
    ...c.tags.map((t) => el("a", { class: "label", href: `${REPO}/releases/tag/${encodeURIComponent(t)}`, style: "--c: var(--green)" }, oct("tag"), t)),
  ];
  // "Merge pull request #N ...": il numero porta alla pull request, il resto al commit.
  const title = pr ? ["Merge pull request ", el("a", { href: `${REPO}/pull/${pr[1]}`, style: "color: var(--link)" }, `#${pr[1]}`), c.subject.slice(pr[0].length)] : [c.subject];
  const copy = el("button", { class: "btn copy", title: "Copia l'hash completo", onclick: () => navigator.clipboard?.writeText(c.hash).then(() => { copy.replaceChildren(oct("check")); setTimeout(() => copy.replaceChildren(oct("copy")), 1200); }) }, oct("copy"));
  return el("div", { class: "row", id: `c-${c.hash}`, "data-hash": c.hash },
    el("div", { class: "main" },
      el("span", { class: "title", title: c.body ? `${c.subject}\n\n${c.body}` : c.subject }, el("a", { href: `${REPO}/commit/${c.hash}` }, title[0]), ...title.slice(1)),
      el("div", { class: "meta" }, avatar(c.author, "avatar", c.avatar), el("b", {}, c.login ?? c.author), `ha fatto il commit ${ago(c.date)}`, el("span", { class: "ok", title: "Commit sul ramo pubblicato" }, oct("check")), ...labels)
    ),
    el("div", { class: "actions" },
      copy,
      el("a", { class: "btn hash", href: `${REPO}/commit/${c.hash}` }, short(c.hash)),
      el("a", { class: "btn browse", href: `${REPO}/tree/${c.hash}`, title: "Sfoglia il repository a questo commit" }, oct("code"))
    )
  );
}

function drawGraph(commits) {
  list.querySelector("svg.graph")?.remove();
  const box = list.getBoundingClientRect();
  const y = new Map();
  for (const c of commits) {
    const r = document.getElementById(`c-${c.hash}`).getBoundingClientRect();
    y.set(c.hash, r.top - box.top + 26);
  }
  const x = (lane) => PAD + lane * LANE + LANE / 2;
  const svg = d3.select(list).insert("svg", ":first-child").attr("class", "graph").attr("width", PAD * 2 + current.width * LANE).attr("height", box.height);
  // Archi: dal commit alla corsia dell'arco (curva), giù lungo la corsia, poi curva fino al genitore.
  for (const e of current.edges) {
    const a = current.pos.get(e.from), b = current.pos.get(e.to);
    const x1 = x(a.lane), y1 = y.get(e.from), xe = x(e.lane), x2 = x(b.lane), y2 = y.get(e.to);
    const p = d3.path();
    p.moveTo(x1, y1);
    const bend = 22;
    if (xe !== x1) { p.bezierCurveTo(x1, y1 + bend * 0.6, xe, y1 + bend * 0.4, xe, y1 + bend); } else p.lineTo(xe, y1 + bend);
    const yEnd = x2 !== xe ? y2 - bend : y2;
    p.lineTo(xe, Math.max(yEnd, y1 + bend));
    if (x2 !== xe) p.bezierCurveTo(xe, y2 - bend * 0.4, x2, y2 - bend * 0.6, x2, y2);
    svg.append("path").attr("d", p.toString()).attr("fill", "none").attr("stroke", e.color).attr("stroke-width", 1.6).attr("stroke-opacity", 0.9);
  }
  // Pallini: anello per le punte dei rami e i merge, punto pieno per gli altri commit.
  for (const c of commits) {
    const p = current.pos.get(c.hash);
    const head = c.refs.length > 0, merge = c.parents.length > 1;
    const g = svg.append("g").attr("class", "node").attr("transform", `translate(${x(p.lane)},${y.get(c.hash)})`);
    g.append("circle").attr("r", 9).attr("fill", "transparent");
    if (head || merge) {
      g.append("circle").attr("r", head ? 5.5 : 4.5).attr("fill", "var(--bg)").attr("stroke", p.color).attr("stroke-width", 2.5);
      if (head) g.append("circle").attr("r", 2.2).attr("fill", p.color);
    } else g.append("circle").attr("r", 3.5).attr("fill", p.color);
    g.on("mouseenter", (ev) => showTip(c, ev.currentTarget)).on("mouseleave", hideTipSoon).on("click", () => { location.href = `${REPO}/commit/${c.hash}`; });
  }
}

// ---------------------------------------------------------------- scheda del commit
let hideTimer = null;
let tipFor = null;
let statsEl = null;
function showTip(c, node) {
  clearTimeout(hideTimer);
  const nb = node.getBoundingClientRect();
  const branches = inBranches(c.hash);
  tip.replaceChildren(...[
    el("div", {}, `Commit del ${fmtFull(c.date)}`),
    c.refs.length ? el("div", {}, el("b", {}, "Punta di"), ...c.refs.map((r) => el("span", { class: "ref" }, oct("branch"), r))) : null,
    c.tags.length ? el("div", {}, el("b", {}, "Release"), ...c.tags.map((t) => el("span", { class: "ref" }, oct("tag"), t))) : null,
    el("div", {}, el("b", {}, c.parents.length ? (c.parents.length > 1 ? "Genitori:" : "Genitore:") : "Primo commit"), ...c.parents.map((h) => el("a", { class: "ref mono", href: `#c-${h}`, onclick: (e) => { e.preventDefault(); jump(h); } }, oct("commit"), short(h)))),
    branches.length ? el("div", {}, el("b", {}, "Nei rami"), ...branches.map((b) => el("span", { class: "ref" }, oct("branch"), b))) : null,
    (statsEl = el("div", { style: "color: var(--muted)" }, "Righe modificate: caricamento da GitHub…")),
  ].filter(Boolean));
  const shown = c.hash;
  tipFor = shown;
  stats(c).then((s) => {
    if (tipFor !== shown) return;
    // I merge (di GitHub) mostrano le modifiche del ramo unito rispetto al primo genitore.
    statsEl.replaceChildren(el("span", { class: "add" }, oct("plus"), ` ${s.add} aggiunte`), el("span", { class: "del" }, oct("minus"), ` ${s.del} rimosse`), el("span", {}, `· ${s.files} file${c.parents.length > 1 ? " (dal ramo unito)" : ""}`));
  }, (e) => statsEl.replaceChildren(e.message));
  tip.style.display = "block";
  const left = Math.min(nb.right + window.scrollX + 10, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 16);
  tip.style.left = `${Math.max(16, left)}px`;
  tip.style.top = `${nb.top + window.scrollY - 8}px`;
}
function hideTipSoon() { hideTimer = setTimeout(() => { tip.style.display = "none"; tipFor = null; }, 250); }
tip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
tip.addEventListener("mouseleave", hideTipSoon);
function jump(hash) {
  let rowEl = document.getElementById(`c-${hash}`);
  if (!rowEl && filter !== "all") { setFilter("all"); rowEl = document.getElementById(`c-${hash}`); }
  if (!rowEl) return;
  rowEl.scrollIntoView({ behavior: "smooth", block: "center" });
  rowEl.classList.add("hit");
  setTimeout(() => rowEl.classList.remove("hit"), 1600);
}

// ---------------------------------------------------------------- tema
const themeBtn = document.getElementById("theme");
try { const t = localStorage.getItem("helios-history-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("helios-history-theme", document.documentElement.dataset.theme); } catch {}
});

let loadedAt = Date.now();
async function boot(force = false) {
  const status = el("div", { class: "day" }, oct("commit"), "Lettura dei commit da GitHub…");
  if (!ALL.length) list.replaceChildren(status);
  try {
    const data = await load(force);
    loadedAt = data.t;
    prepare(data);
    renderIntro();
    renderBranches();
    renderList();
  } catch (e) {
    const box = document.getElementById("intro");
    box.replaceChildren(el("h1", {}, "La storia di Helios"), el("p", { style: "color: var(--red)" }, e.message), el("p", {}, "Il racconto ha bisogno della connessione a GitHub (api.github.com)."));
    if (!ALL.length) list.replaceChildren();
  }
}
document.getElementById("refresh").addEventListener("click", () => boot(true));
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => ALL.length && renderList(), 120); });
boot();
</script>
